<mat-sidenav-container class="sidenav-container">
  <mat-sidenav
    #drawer
    class="sidenav"
    fixedInViewport
    [mode]="(isHandset$ | async) ? 'over' : 'side'"
    [opened]="(isHandset$ | async) === false"
  >
    <div class="sidenav-header">
      <img src="/assets/icon.jpg" alt="Logo" class="nav-logo">
      <span class="menu-title">AI DOCUMENT<br>AUTOMATION</span>
    </div>

    <mat-nav-list *ngIf="isLoggedIn" class="nav-links">
      <a mat-list-item routerLink="/navbar/files" routerLinkActive="active-link">
        <mat-icon matListItemIcon>folder</mat-icon>
        <div matListItemTitle>Files</div>
      </a>

      <a mat-list-item routerLink="/navbar/Extract" routerLinkActive="active-link">
        <mat-icon matListItemIcon>text_snippet</mat-icon>
        <div matListItemTitle>Extract</div>
      </a>

      <a mat-list-item routerLink="/navbar/Validate" routerLinkActive="active-link">
        <mat-icon matListItemIcon>verified</mat-icon>
        <div matListItemTitle>Validate</div>
      </a>

      <a mat-list-item routerLink="/navbar/chat" routerLinkActive="active-link">
        <mat-icon matListItemIcon>chat</mat-icon>
        <div matListItemTitle>Chat</div>
      </a>

      <a mat-list-item routerLink="/navbar/Export" routerLinkActive="active-link">
        <mat-icon matListItemIcon>download</mat-icon>
        <div matListItemTitle>Export</div>
      </a>

      <a mat-list-item routerLink="/navbar/Audit" routerLinkActive="active-link">
        <mat-icon matListItemIcon>history</mat-icon>
        <div matListItemTitle>Audit Logs</div>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="main-toolbar">
      <button *ngIf="isHandset$ | async" mat-icon-button (click)="drawer.toggle()">
        <mat-icon>menu</mat-icon>
      </button>

      <span class="spacer"></span>

      <div class="actions">
        <ng-container *ngIf="!isLoggedIn">
          <button mat-button routerLink="/Login" class="login-btn">Login</button>
          <button mat-flat-button color="primary" routerLink="/register">Register</button>
        </ng-container>

        <ng-container *ngIf="isLoggedIn">
          <button mat-button [matMenuTriggerFor]="userMenu" class="user-profile-btn">
            <mat-icon>account_circle</mat-icon>
            <span class="user-email">{{ userEmail }}</span>
            <mat-icon class="dropdown-icon">expand_more</mat-icon>
          </button>

          <mat-menu #userMenu="matMenu" class="modern-menu">
            <button mat-menu-item routerLink="/navbar/profile">
              <mat-icon>person</mat-icon>
              <span>Profile</span>
            </button>
            <button mat-menu-item routerLink="/navbar/settings">
              <mat-icon>settings</mat-icon>
              <span>Settings</span>
            </button>
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="logout()">
              <mat-icon color="warn">logout</mat-icon>
              <span>Logout</span>
            </button>
          </mat-menu>
        </ng-container>
      </div>
    </mat-toolbar>

    <main class="content-wrapper">
      <div class="content">
        <router-outlet></router-outlet>
      </div>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>

<div class="audit-container">

  <div class="audit-header">
    <div class="left">
      <h2>Audit Logs</h2>
      <p>Track system activities and document changes</p>
    </div>

    <div class="right">
      <mat-form-field appearance="outline" class="search-field">
        <mat-label>Search logs</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Search by user, action...">
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>

      <button mat-stroked-button color="primary">
        <mat-icon>filter_list</mat-icon>
        Filters
      </button>
    </div>
  </div>

  <mat-card class="audit-card">

    <table mat-table [dataSource]="dataSource" class="audit-table">

      <ng-container matColumnDef="user">
        <th mat-header-cell *matHeaderCellDef>User</th>
        <td mat-cell *matCellDef="let log">
          <div class="user-info">
            <mat-icon>person</mat-icon>
            <span>{{log.user}}</span>
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="action">
        <th mat-header-cell *matHeaderCellDef>Action</th>
        <td mat-cell *matCellDef="let log">
          <span class="action-pill" [ngClass]="log.actionType">
            {{log.action}}
          </span>
        </td>
      </ng-container>

      <ng-container matColumnDef="file">
        <th mat-header-cell *matHeaderCellDef>File</th>
        <td mat-cell *matCellDef="let log">
          <div class="file-info">
            <mat-icon>description</mat-icon>
            {{log.fileName}}
          </div>
        </td>
      </ng-container>

      <ng-container matColumnDef="date">
        <th mat-header-cell *matHeaderCellDef>Date & Time</th>
        <td mat-cell *matCellDef="let log">
          {{log.timestamp | date:'medium'}}
        </td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let log">
          <span class="status-pill" [ngClass]="log.status">
            {{log.status}}
          </span>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="row"></tr>

    </table>

    <div *ngIf="dataSource.data.length === 0" class="empty-state">
      <mat-icon>history</mat-icon>
      <p>No activity logs found</p>
    </div>

  </mat-card>
</div>
